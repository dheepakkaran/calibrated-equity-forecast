# Grades tracked guesses against what the market actually did.
#
# One run a day, after the Indian close:
#
#   10:15 UTC = 15:45 IST
#
# There used to be a second run at 09:20 IST that read the opening gap. It was
# dropped, and the reason is worth recording: GitHub's scheduler is best-effort,
# and on 2026-09-09 this workflow fired 4.5 hours late. A gap read at 13:53 IST
# describes nothing — the market had been open for four hours.
#
# This run does not have that problem. The closing price stops changing at
# 15:30 IST, so a job that reads it is equally correct whether it starts at
# 15:45 or at midnight. Late does not mean wrong when the number has settled.
#
# Weekdays only. Indian exchange holidays are handled by the resolver itself:
# a session with no printed price is left pending rather than graded against
# data that does not exist.
name: Resolve tracked guesses

on:
  schedule:
    - cron: '15 10 * * 1-5'   # 15:45 IST, after the close
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resolve-tracked
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # Only what the resolver needs. It does arithmetic on two prices, so
      # installing the modelling stack would be minutes of wasted runner time.
      - name: Install
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet yfinance pandas numpy python-dotenv
          python -m pip install --quiet -e . --no-deps

      - name: Resolve
        run: python scripts/resolve_tracked.py

      - name: Commit the ledger
        run: |
          if git diff --quiet -- tracking/; then
            echo "no change to the ledger"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tracking/
          git commit -m "tracking: resolved $(date -u +%Y-%m-%d)"
          git push

      - name: Summary
        run: |
          echo "### Tracking" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat tracking/summary.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
