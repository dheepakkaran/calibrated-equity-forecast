[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "calibrated-equity-forecast"
version = "0.1.0"
description = "Calibrated directional forecasting with delayed-reward ensemble reweighting for NSE equities"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["cef*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
